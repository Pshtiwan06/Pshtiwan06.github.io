<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/SiteFiles/CSS/terug.css">
    <link rel="stylesheet" href="colorPicker.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Picker Pro</title>
</head>
<body>
    <div class="colorPicker">
        <div class="components">

            <div class="component">
                <span>0 <input id="sldrood" type="range" class="slider" value="128" min="0" max="255"> 255</span>
                <span>Rood</span>
                <span id="rood">128</span>
            </div>

            <div class="component">
                <span>0 <input id="sldgroen" type="range" class="slider" value="128" min="0" max="255"> 255</span>
                <span>Groen</span>
                <span id="groen">128</span>
            </div>

            <div class="component">
                <span>0 <input id="sldblauw" type="range" class="slider" value="128" min="0" max="255"> 255</span>
                <span>Blauw</span>
                <span id="blauw">128</span>
            </div>

        </div>

        <div class="swatch" id="swatch"></div>
        <input type="button" id="btnSave" value="save">
    </div>
    <div id="divColor"></div>

    <footer>
        <div>
            <ul>
            <li><a href="/SiteFiles/Labs/lab21.html">Terug</a></li>
            </ul>
        </div>
    </footer>
    <script src="colorPicker.js"></script>
</body>
</html>
